name: VPN protected objects inventory
on:
  pull_request:
    paths:
      - 'src/nmc_api/protected_objects.py'
      - 'src/vpn_protected_models.py'
      - 'src/vpn_protected_validation.py'
      - 'src/nmc_api/__init__.py'
      - 'templates/vpn_protected_objects.html'
      - 'templates/vpn_overview.html'
      - 'tests/test_vpn_protected_objects.py'
      - '.github/workflows/vpn-protected-objects.yml'
  workflow_dispatch:
jobs:
  inventory-validation:
    name: Admin, CSRF, CIDR, SQLite, no network mutation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m compileall -q src/nmc_api/protected_objects.py src/vpn_protected_models.py src/vpn_protected_validation.py
      - name: Inventory integration and validation tests
        run: python -m pytest -q tests/test_vpn_protected_objects.py
