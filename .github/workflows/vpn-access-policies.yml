name: VPN v2 access-policy drafts
on:
  pull_request:
    paths:
      - 'src/nmc_api/access_policies.py'
      - 'src/nmc_api/__init__.py'
      - 'src/vpn_access_policy_models.py'
      - 'src/vpn_access_policy_validation.py'
      - 'templates/vpn_access_policies.html'
      - 'templates/vpn_access_policy_preview.html'
      - 'templates/vpn_overview.html'
      - 'templates/vpn_protected_objects.html'
      - 'tests/test_vpn_access_policies.py'
      - '.github/workflows/vpn-access-policies.yml'
  workflow_dispatch:
jobs:
  policy-draft-validation:
    name: Policy intentions, CSRF, SQLite, read-only preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m compileall -q src/nmc_api/access_policies.py src/vpn_access_policy_models.py src/vpn_access_policy_validation.py
      - name: Policy admission and no-network tests
        run: python -m pytest -q tests/test_vpn_access_policies.py
