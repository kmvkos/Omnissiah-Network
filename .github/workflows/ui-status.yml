name: UI status and navigation validation
on:
  pull_request:
    paths:
      - 'agents/app/heartbeat.py'
      - 'src/nmc_api/heartbeat.py'
      - 'src/app.py'
      - 'templates/**'
      - 'tests/test_ui_status.py'
      - 'tests/test_vpn_reconcile.py'
      - 'deploy/vpn_reconcile.py'
      - 'src/vpn_reconcile.py'
      - 'src/vpn_change_preview.py'
      - 'tests/test_vpn_change_preview.py'
      - 'deploy/vpn_helper.py'
      - '.github/workflows/ui-status.yml'
jobs:
  ui-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest jinja2
      - run: python -m compileall -q agents/app/heartbeat.py src/nmc_api/heartbeat.py src/app.py src/vpn_reconcile.py src/vpn_change_preview.py deploy/vpn_reconcile.py deploy/vpn_helper.py
      - run: python -m pytest -q tests/test_ui_status.py tests/test_vpn_reconcile.py tests/test_vpn_change_preview.py
