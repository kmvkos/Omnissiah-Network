name: Policy Center functional validation
on:
  pull_request:
    paths:
      - 'src/nmc_api/access_policies.py'
      - 'src/nmc_api/policy_apply.py'
      - 'src/nmc_api/__init__.py'
      - 'templates/layout.html'
      - 'templates/vpn_access_policies.html'
      - 'templates/vpn_overview.html'
      - 'templates/access_policy_apply_preview.html'
      - 'deploy/vpn_acl_policy.py'
      - 'deploy/vpn_rpc.py'
      - 'agents/app/agent.py'
      - 'agents/app/vpn_client.py'
      - 'ansible/roles/services/**'
      - 'tests/test_vpn_acl_policy.py'
      - 'tests/test_vpn_policy_center.py'
      - '.github/workflows/policy-center.yml'
  workflow_dispatch:
jobs:
  policy-center:
    name: Read-only preview, explicit apply, revision check and rollback
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile server/client modules
        run: python -m compileall -q src/nmc_api/access_policies.py src/nmc_api/policy_apply.py deploy/vpn_acl_policy.py deploy/vpn_rpc.py agents/app/agent.py agents/app/vpn_client.py
      - name: Test isolated NFT transaction and policies
        run: python -m pytest -q tests/test_vpn_acl_policy.py tests/test_vpn_policy_center.py tests/test_vpn_access_policies.py tests/test_vpn_policy_legacy_bridge.py tests/test_vpn_cognitor_blueprint.py tests/test_vpn_protected_objects.py
