name: Cognitor draft registration validation
on:
  pull_request:
    paths:
      - 'src/nmc_api/cognitors.py'
      - 'src/nmc_api/__init__.py'
      - 'src/vpn_cognitor_models.py'
      - 'src/vpn_cognitor_validation.py'
      - 'templates/vpn_cognitors.html'
      - 'templates/vpn_overview.html'
      - 'tests/test_vpn_cognitor_blueprint.py'
      - 'tests/test_vpn_cognitor_validation.py'
      - '.github/workflows/vpn-cognitor.yml'
  workflow_dispatch:
jobs:
  pending-client-registration:
    name: Admin, CSRF, SQLite and no network writes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install controller dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check module syntax
        run: python -m compileall -q src/nmc_api/cognitors.py src/vpn_cognitor_models.py src/vpn_cognitor_validation.py
      - name: Test database registration, CSRF and address admission
        run: python -m pytest -q tests/test_vpn_cognitor_blueprint.py tests/test_vpn_cognitor_validation.py
