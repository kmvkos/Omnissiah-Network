name: VPN foundation validation
on:
  pull_request:
    paths:
      - 'agents/app/vpn_plan.py'
      - 'agents/app/vpn_readiness.py'
      - 'src/vpn_plan.py'
      - 'src/vpn_topology.py'
      - 'tests/test_vpn_topology.py'
      - 'src/app.py'
      - 'src/vpn_tx_revision.py'
      - 'tests/test_vpn_tx_revision.py'
      - 'templates/vpn_overview.html'
      - 'ansible/roles/services/templates/agent-bootstrap.json.j2'
      - 'deploy/bootstrap_agent.py'
      - 'deploy/vpn_rpc.py'
      - 'deploy/vpn_linux_backend.py'
      - 'deploy/vpn_mesh_transaction.py'
      - 'tests/test_vpn_linux_backend.py'
      - 'tests/test_vpn_systemd_management.py'
      - 'agents/app/vpn_client.py'
      - 'tests/test_vpn_rpc.py'
      - 'ansible/roles/services/templates/vpn-rpc.service.j2'
      - 'ansible/roles/services/templates/vpn-rpc.socket.j2'
      - 'agents/app/agent.py'
      - 'tests/test_agent_legacy_mutation_guard.py'
      - 'ansible/roles/services/tasks/main.yml'
      - 'ansible/site.yml'
      - 'ansible/ansible.cfg'
      - 'tests/test_ansible_delegated_probe.py'
      - 'tests/test_ansible_ssh_config.py'
      - 'deploy/vpn_helper.py'
      - 'tests/test_vpn_plan.py'
      - 'tests/test_vpn_helper.py'
      - 'tests/test_vpn_readiness.py'
      - 'tests/test_vpn_topology.py'
      - '.github/workflows/vpn-foundation.yml'
  workflow_dispatch:
jobs:
  pure-vpn-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest ansible-core
      - name: Ensure syntax
        run: python -m compileall -q agents/app/vpn_plan.py agents/app/vpn_readiness.py src/vpn_plan.py src/vpn_topology.py deploy/vpn_helper.py deploy/vpn_rpc.py agents/app/vpn_client.py agents/app/agent.py src/app.py src/vpn_tx_revision.py
      - name: Validate managed site playbook syntax
        run: ansible-playbook -i ansible/inventory.example.yml ansible/site.yml --syntax-check
      - name: Validate separate VPN playbook syntax
        run: ansible-playbook -i ansible/inventory.example.yml ansible/vpn-mesh.yml --syntax-check
      - name: Validate planner and helper without root
        run: python -m pytest -q tests/test_vpn_plan.py tests/test_vpn_helper.py tests/test_vpn_readiness.py tests/test_vpn_topology.py tests/test_vpn_rpc.py tests/test_ansible_delegated_probe.py tests/test_ansible_ssh_config.py tests/test_agent_legacy_mutation_guard.py tests/test_vpn_linux_backend.py tests/test_vpn_systemd_management.py tests/test_vpn_tx_revision.py
