name: VPN foundation validation
on:
  pull_request:
    paths:
      - 'agents/app/vpn_plan.py'
      - 'deploy/vpn_helper.py'
      - 'tests/test_vpn_plan.py'
      - 'tests/test_vpn_helper.py'
      - '.github/workflows/vpn-foundation.yml'
  workflow_dispatch:
jobs:
  pure-vpn-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Ensure syntax
        run: python -m compileall -q agents/app/vpn_plan.py deploy/vpn_helper.py
      - name: Validate planner and helper without root
        run: python -m pytest -q tests/test_vpn_plan.py tests/test_vpn_helper.py
