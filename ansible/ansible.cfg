[defaults]
inventory = inventory.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = /usr/bin/python3
timeout = 60

[ssh_connection]
pipelining = False
# Use fresh sessions while bootstrapping passwords/sudo on newly created VMs.
# Silence normal OpenSSH session-close notices on stderr: sshpass may misclassify
# them as transport failures when a remote Ansible module exits nonzero.
# Keep actual SSH errors visible at ERROR level.
ssh_args = -o ControlMaster=no -o ControlPersist=no -o LogLevel=ERROR
