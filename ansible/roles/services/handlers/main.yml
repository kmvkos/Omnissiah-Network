---
- name: Restart application
  ansible.builtin.systemd_service:
    name: omnissiah-network
    daemon_reload: true
    state: restarted
- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

- name: Restart VPN RPC
  ansible.builtin.systemd_service:
    name: omnissiah-vpn-rpc.service
    daemon_reload: true
    state: restarted
  when: inventory_hostname in groups.magos
